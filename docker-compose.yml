name: docklift

services:
  backend:
    image: docklift-backend
    build: ./backend
    container_name: docklift-backend
    hostname: docklift
    restart: unless-stopped
    expose:
      - "8000"
    # privileged required for nsenter into host PID 1 (system update / reboot)
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./deployments:/deployments
      - ./nginx-proxy/conf.d:/nginx-conf
      # RW so backups can restore certificates; nginx-proxy mounts the same path read-only
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
      - ./backups:/data/backups
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      - /proc:/host/proc:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/docklift.db
      - PORT=8000
      - DEPLOYMENTS_PATH=/deployments
      - NGINX_CONF_PATH=/nginx-conf
      - DOCKER_NETWORK=docklift_network
      - BACKUP_PATH=/data/backups
      - DATA_PATH=/app/data
      # App publish ports (5500+ avoids Windows Hyper-V reserved 3000–5000)
      - PORT_RANGE_START=${PORT_RANGE_START:-5500}
      - PORT_RANGE_END=${PORT_RANGE_END:-5600}
      - JWT_SECRET=${JWT_SECRET:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # Comma-separated browser origins if dashboard is not same-host as API
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - DOCKLIFT_FRONTEND_URL=${DOCKLIFT_FRONTEND_URL:-http://localhost:8080}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
      - LETSENCRYPT_PATH=/etc/letsencrypt
      - CERTBOT_CONTAINER=docklift-certbot
    networks:
      - docklift_network
    depends_on:
      - nginx-proxy

  frontend:
    image: docklift-frontend
    build: ./frontend
    container_name: docklift-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - docklift_network
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: docklift-nginx
    restart: unless-stopped
    # Dashboard on :8080 (all interfaces, Coolify-style). Optional: DASHBOARD_BIND=127.0.0.1
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docklift_network
    depends_on:
      - frontend
      - backend

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: docklift-nginx-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/snippets:/etc/nginx/snippets:ro
      - ./nginx-proxy/certbot/www:/var/www/certbot:ro
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - docklift_network
    depends_on:
      - certbot

  # Let's Encrypt ACME sidecar (webroot). Backend triggers issue via docker exec.
  certbot:
    image: certbot/certbot
    container_name: docklift-certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          echo "[certbot] $(date -u +%Y-%m-%dT%H:%M:%SZ) checking renewals"
          certbot renew --webroot -w /var/www/certbot || true
          sleep 12h
        done
    volumes:
      - ./nginx-proxy/certbot/www:/var/www/certbot
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
    networks:
      - docklift_network

networks:
  docklift_network:
    name: docklift_network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd12:3456:789a::/64
