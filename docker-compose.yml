name: docklift

# Three containers:
#   backend      Go server: API, WebSocket terminal and the embedded dashboard (:8080 on the host)
#   nginx-proxy  user app domains and the optional panel domain (:80/:443)
#   certbot      Let's Encrypt renewals (webroot); the backend triggers issuance via docker exec

services:
  backend:
    image: docklift-backend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = the version in the root package.json.
        VERSION: ${DOCKLIFT_BUILD_VERSION:-}
    container_name: docklift-backend
    hostname: docklift
    restart: unless-stopped
    # Dashboard on :8080 — public by default so install can open http://SERVER_IP:8080.
    # First account still requires the server-printed bootstrap secret.
    # Harden later: Settings → Domain (HTTPS), firewall, or DASHBOARD_BIND=127.0.0.1.
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:8080:8000"
    # privileged + host PID: nsenter into host PID 1 (system update / reboot / upgrade)
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./deployments:/deployments
      - ./nginx-proxy/conf.d:/nginx-conf
      # RW so backups can restore certificates; nginx-proxy mounts the same path read-only
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
      - ./backups:/data/backups
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      - /proc:/host/proc:ro
    environment:
      - DATABASE_URL=file:/app/data/docklift.db
      - PORT=8000
      - DEPLOYMENTS_PATH=/deployments
      - NGINX_CONF_PATH=/nginx-conf
      - DOCKER_NETWORK=docklift_network
      - BACKUP_PATH=/data/backups
      - DATA_PATH=/app/data
      # App publish ports (5500+ avoids Windows Hyper-V reserved 3000–5000)
      - PORT_RANGE_START=${PORT_RANGE_START:-5500}
      - PORT_RANGE_END=${PORT_RANGE_END:-5600}
      - JWT_SECRET=${JWT_SECRET:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # Comma-separated browser origins if dashboard is not same-host as API
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Peers whose X-Forwarded-* headers are trusted: loopback plus the fixed
      # addresses of docklift-nginx-proxy below. App containers on
      # docklift_network (and the network gateway, which fronts :8080 clients)
      # are not trusted, so they cannot spoof client IPs.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.28.255.254,fd12:3456:789a::ffff:fffe}
      - DOCKLIFT_FRONTEND_URL=${DOCKLIFT_FRONTEND_URL:-http://localhost:8080}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
      - LETSENCRYPT_PATH=/etc/letsencrypt
      - CERTBOT_CONTAINER=docklift-certbot
      - NGINX_PROXY_CONTAINER=docklift-nginx-proxy
    networks:
      - docklift_network
    depends_on:
      - nginx-proxy

  nginx-proxy:
    image: nginx:1.30.8-alpine  # nginx stable; bump deliberately (upgrade.sh pulls it)
    container_name: docklift-nginx-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/snippets:/etc/nginx/snippets:ro
      - ./nginx-proxy/certbot/www:/var/www/certbot:ro
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt:ro
    networks:
      docklift_network:
        # Fixed, at the top of each subnet (Docker allocates dynamic addresses
        # from the bottom), so TRUSTED_PROXIES can name exactly this container.
        ipv4_address: 172.28.255.254
        ipv6_address: fd12:3456:789a::ffff:fffe
    depends_on:
      - certbot

  # Let's Encrypt ACME sidecar (webroot). Backend triggers issue via docker exec.
  certbot:
    image: certbot/certbot:v5.10.0  # bump deliberately (upgrade.sh pulls it)
    container_name: docklift-certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          echo "[certbot] $(date -u +%Y-%m-%dT%H:%M:%SZ) checking renewals"
          certbot renew --webroot -w /var/www/certbot || true
          sleep 12h
        done
    volumes:
      - ./nginx-proxy/certbot/www:/var/www/certbot
      - ./nginx-proxy/certbot/conf:/etc/letsencrypt
    networks:
      - docklift_network

networks:
  docklift_network:
    name: docklift_network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd12:3456:789a::/64
