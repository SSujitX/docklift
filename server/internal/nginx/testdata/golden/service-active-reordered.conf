
# Main server block for My App (prod)
# docklift-ssl: active primary=b.example.com cert=a.example.com
server {
    listen 80;
    server_name b.example.com a.example.com;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b.example.com a.example.com;

    ssl_certificate /etc/letsencrypt/live/a.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a.example.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10 docklift-my-app-prod;
        proxy_pass http://$target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
