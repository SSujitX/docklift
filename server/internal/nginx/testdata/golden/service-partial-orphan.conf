
# Main server block for web
# docklift-ssl: partial primary=b.example.com cert=b.example.com
server {
    listen 80;
    server_name b.example.com c.example.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/snippets/acme.conf;

    location / {
        set $target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10 docklift-shop-web;
        proxy_pass http://$target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b.example.com;

    ssl_certificate /etc/letsencrypt/live/b.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b.example.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10 docklift-shop-web;
        proxy_pass http://$target_3f2c9a4e_1b7d_4c2e_9f0a_6d5e4c3b2a10:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
