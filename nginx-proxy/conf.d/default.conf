# Catch-all: do NOT expose the DockLift dashboard on unknown Host values.
# Public dashboard access must use an explicit panel domain (Settings → Domain).
# Local admin UI remains on dashboard nginx :8080 (DASHBOARD_BIND, default 127.0.0.1).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 must still work for any hostname during issuance
    include /etc/nginx/snippets/acme.conf;

    location / {
        return 444;
    }
}

# Reject TLS for unknown hostnames (no shared default cert / no dashboard leak)
server {
    listen 443 default_server ssl;
    listen [::]:443 default_server ssl;
    server_name _;
    ssl_reject_handshake on;
}
