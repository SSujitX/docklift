worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Log URI without query string (tokens must never appear in access logs)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # Conditional Connection header for WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # TLS defaults for generated HTTPS server blocks
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Include server blocks for deployed projects
    include /etc/nginx/conf.d/*.conf;
}
