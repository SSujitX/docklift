# Install smoke test — full install.sh on a clean runner, then upgrade.sh over it.
#   fresh:        install.sh (this commit) → first admin via bootstrap secret → checks
#                 → upgrade.sh (this commit, rebuild path) → same admin still logs in
#   from-release: install.sh of the latest GitHub release → first admin → upgrade.sh to
#                 this commit → same admin still logs in (data kept, obsolete containers gone)
name: Install
# Quote the whole value — bare `#{0}` is a YAML comment and truncates `${{ }}`.
run-name: "Install · ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches: [master]
    paths-ignore:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, from-release]
    env:
      DOCKLIFT_ADMIN_EMAIL: admin@docklift.test
      DOCKLIFT_ADMIN_PASSWORD: Smoke-Test-Password-1
    steps:
      - uses: actions/checkout@v6
        with:
          # upgrade.sh (DOCKLIFT_CI_LOCAL) fetches this commit into /opt/docklift
          fetch-depth: 0

      - name: Preparing system
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl

      - name: Install (this commit)
        if: matrix.scenario == 'fresh'
        run: |
          chmod +x install.sh
          sudo CI=true DOCKLIFT_CI_LOCAL=true ./install.sh 2>&1 | tee install_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Install (latest release)
        if: matrix.scenario == 'from-release'
        run: |
          tag=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/SSujitX/docklift/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "Latest release: $tag"
          curl -fsSL "https://raw.githubusercontent.com/SSujitX/docklift/${tag}/install.sh" -o release-install.sh
          sudo CI=true bash release-install.sh "v=${tag}" 2>&1 | tee install_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Wait for health
        run: |
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 2
          done
          sudo docker ps -a
          sudo docker logs docklift-backend 2>&1 | tail -80
          exit 1

      - name: First admin + checks
        if: matrix.scenario == 'fresh'
        run: sudo -E bash scripts/smoke.sh register

      - name: First admin (latest release)
        if: matrix.scenario == 'from-release'
        run: |
          secret=$(sudo cat /opt/docklift/data/.bootstrap-secret | tr -d '\n\r')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -H "x-bootstrap-secret: $secret" \
            -d "{\"email\":\"$DOCKLIFT_ADMIN_EMAIL\",\"password\":\"$DOCKLIFT_ADMIN_PASSWORD\",\"name\":\"Smoke Admin\"}" \
            http://127.0.0.1:8080/api/auth/register)
          test "$code" = 201

      - name: Upgrade to this commit
        run: |
          sudo DOCKLIFT_CI_LOCAL=true bash upgrade.sh 2>&1 | tee upgrade_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Checks after upgrade
        run: sudo -E bash scripts/smoke.sh check

      - name: Diagnostics
        if: failure()
        run: |
          sudo docker ps -a || true
          sudo docker logs docklift-backend 2>&1 | tail -100 || true
          sudo tail -100 /opt/docklift/upgrade.log || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docklift install (${{ matrix.scenario }}): ${{ job.status }}"
            echo "| Container | Status |"
            echo "|---|---|"
            for c in docklift-backend docklift-nginx-proxy docklift-certbot; do
              echo "| $c | $(sudo docker inspect -f '{{.State.Status}} {{if .State.Health}}({{.State.Health.Status}}){{end}}' "$c" 2>/dev/null || echo missing) |"
            done
            echo ""
            echo "Health: \`$(curl -fsS http://127.0.0.1:8080/api/health 2>/dev/null || echo unavailable)\`"
            echo ""
            echo "Image: \`$(sudo docker image ls docklift-backend:latest --format '{{.Size}}' 2>/dev/null)\`"
          } >> "$GITHUB_STEP_SUMMARY"
