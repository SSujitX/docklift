# Build VitePress site → GitHub Pages (docklift.dev).
# Called from Release after the release commit + tag, or on website/CHANGELOG pushes.
name: Docs
run-name: "Docs · ${{ github.event_name == 'workflow_call' && format('after Release · {0}', github.ref_name) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || format('site · {0}', github.ref_name) }}"

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (Release passes the new tag)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Called from Release: the new tag (chore(release) commit + CHANGELOG). A called
          # workflow sees the caller's github context, so github.sha there is the commit
          # Release started from, before the release commit.
          # push / dispatch: the triggering commit (or branch tip for dispatch).
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Install and build
        working-directory: website
        run: |
          bun install
          bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
