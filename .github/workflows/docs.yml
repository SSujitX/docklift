name: Docs

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  # Release commits use [skip ci], so also rebuild after a successful Release & Test
  # (that is when CHANGELOG.md is updated by semantic-release).
  workflow_run:
    workflows: ["Release & Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the commit that *started* Release & Test
          # (before semantic-release). Check out the branch tip so the later
          # chore(release) commit — and its CHANGELOG.md — is included.
          ref: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch || 'master') || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        working-directory: website
        run: |
          bun install
          bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
