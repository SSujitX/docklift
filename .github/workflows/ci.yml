name: CI
run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches: [master]
    paths-ignore:
      - "website/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/install.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go:
    name: Go (fmt, vet, test, vulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            tests/contract/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l server tests/contract)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          (cd server && go vet ./...)
          (cd tests/contract && go vet ./...)

      - name: go test (server)
        working-directory: server
        run: go test -count=1 ./...

      - name: govulncheck
        working-directory: server
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  contract:
    name: Contract suite (Go binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            tests/contract/go.sum

      - name: Build server
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/docklift" ./cmd/docklift

      - name: Contract tests
        working-directory: tests/contract
        run: DOCKLIFT_GO_BIN="$RUNNER_TEMP/docklift" go test -count=1 ./...

  frontend:
    name: Frontend (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bunx vite build

      - name: Dependency audit (prod)
        run: bun audit --prod

  shell:
    name: Shell scripts, compose, regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: bash -n + shellcheck
        run: |
          scripts=(install.sh install-dev.sh upgrade.sh uninstall.sh scripts/*.sh)
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --version
          shellcheck "${scripts[@]}"

      - name: Upgrade backend_run_state shell behavior (set -e + stubs)
        run: bash scripts/test-upgrade-backend-run-state.sh

      # install.sh, install-dev.sh, upgrade.sh and uninstall.sh each carry the same
      # progress helper block; fails if the copies differ or the helpers misbehave.
      - name: Shared progress helpers (identical copies + behavior)
        run: bash scripts/test-ui-helpers.sh

      - name: Compose config validate
        run: docker compose -f docker-compose.yml config --quiet

      - name: Compose layout regressions
        run: |
          services=$(docker compose -f docker-compose.yml config --services | sort | tr '\n' ' ')
          test "$services" = "backend certbot nginx-proxy " || { echo "unexpected services: $services"; exit 1; }
          # Dashboard on SERVER_IP:8080 by default, served by the Go backend
          grep -q 'DASHBOARD_BIND:-0.0.0.0}:8080:8000' docker-compose.yml
          # `! cmd` never trips `set -e`, so forbidden patterns fail explicitly
          if grep -q 'DASHBOARD_BIND:-127.0.0.1' docker-compose.yml; then exit 1; fi
          # Forwarded headers trusted only from nginx-proxy's fixed addresses + loopback
          grep -q 'ipv4_address: 172.28.255.254' docker-compose.yml
          grep -q 'ipv6_address: fd12:3456:789a::ffff:fffe' docker-compose.yml
          grep -q 'TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.28.255.254,fd12:3456:789a::ffff:fffe}' docker-compose.yml

      - name: Release-blocker regressions
        run: |
          # `! cmd` never trips `set -e`, so forbidden patterns fail explicitly
          forbid() { if grep "$@"; then echo "forbidden pattern: $*"; exit 1; fi; }
          grep -q 'backend_run_state' upgrade.sh
          grep -qE 'if backend_run_state; then' upgrade.sh
          grep -q 'BACKEND_STATE' upgrade.sh
          forbid -qE '^[[:space:]]*backend_run_state[[:space:]]*$' upgrade.sh
          grep -q 'arm_rollback' upgrade.sh
          grep -q 'remove_obsolete_containers' upgrade.sh
          grep -q 'actions/checkout@v6' .github/workflows/ci.yml
          forbid -q 'actions/checkout@v7' .github/workflows/*.yml
          grep -q 'oven/bun:1.4.5-alpine' Dockerfile
          grep -q 'golang:1.27.4-alpine' Dockerfile
          forbid -rF 'docker image prune' server/internal --include='*.go' --exclude='*_test.go'
          forbid -rF 'docker system prune' server/internal --include='*.go' --exclude='*_test.go'

  docker:
    name: Docker image + Docker-gated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            tests/contract/go.sum

      - name: Build image
        run: docker build -t docklift-backend:ci .

      - name: Image smoke test (health + embedded dashboard)
        run: |
          docker run -d --name docklift-ci -p 127.0.0.1:18080:8000 docklift-backend:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.State.Health.Status}}' docklift-ci)" != unhealthy
          for tool in docker git bash nsenter ps railpack; do
            docker exec docklift-ci sh -c "command -v $tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done
          docker exec docklift-ci docker compose version
          docker exec docklift-ci docker buildx version

      - name: Image logs
        if: always()
        run: docker logs docklift-ci 2>&1 | tail -50 || true

      - name: Docker-gated server tests
        working-directory: server
        env:
          DOCKLIFT_DOCKER: "1"
        run: go test -count=1 ./...

      - name: Build server
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/docklift" ./cmd/docklift

      - name: Docker-gated contract tests
        working-directory: tests/contract
        env:
          DOCKLIFT_DOCKER: "1"
        run: DOCKLIFT_GO_BIN="$RUNNER_TEMP/docklift" go test -count=1 ./...
